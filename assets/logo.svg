<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" stroke="#30363d" stroke-width="4"/>

  <!-- Glowing Outer Ring Segment -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad-neon)" stroke-width="24" stroke-dasharray="750 250" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Code Chevron Left: < -->
  <path d="M 210 190 L 140 256 L 210 322" fill="none" stroke="#58a6ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Chevron Right: > -->
  <path d="M 302 190 L 372 256 L 302 322" fill="none" stroke="#bc8cff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / Node Link: / -->
  <line x1="275" y1="180" x2="237" y2="332" stroke="url(#grad-neon)" stroke-width="20" stroke-linecap="round" />

  <!-- Orbit Connection Nodes -->
  <circle cx="256" cy="96" r="14" fill="#58a6ff" filter="url(#glow)"/>
  <circle cx="395" cy="336" r="12" fill="#bc8cff" filter="url(#glow)"/>
  <circle cx="117" cy="336" r="12" fill="#3fb950" filter="url(#glow)"/>
</svg>